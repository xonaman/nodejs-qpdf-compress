name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 pins VS 2022; windows-latest moved to VS 2026 whose MSVC
        # hits an internal compiler error (C1001) building node-addon-api.
        # The windows-canary workflow re-tests windows-latest weekly; drop this
        # pin once it goes green.
        os: [ubuntu-latest, macos-latest, windows-2022]
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev nasm

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib --triplet x64-windows-static
        env:
          VCPKG_ROOT: C:\vcpkg

      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run typecheck

      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/download-mozjpeg.mjs', 'scripts/download-qpdf.mjs', 'scripts/download-harfbuzz.mjs', 'scripts/native-deps.json') }}

      - name: Build dependencies and native addon
        run: |
          node scripts/download-mozjpeg.mjs
          node scripts/download-qpdf.mjs
          node scripts/download-harfbuzz.mjs
          npx node-gyp rebuild
          node scripts/bundle-lib.mjs
        env:
          VCPKG_ROOT: ${{ runner.os == 'Windows' && 'C:\vcpkg' || '' }}

      - run: npm test
