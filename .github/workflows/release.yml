name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 pins VS 2022; windows-latest moved to VS 2026 whose MSVC
        # hits an internal compiler error (C1001) building node-addon-api.
        os: [ubuntu-latest, macos-latest, windows-2022]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev nasm

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib --triplet x64-windows-static
        env:
          VCPKG_ROOT: C:\vcpkg

      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run typecheck

      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/download-mozjpeg.mjs', 'scripts/download-qpdf.mjs', 'scripts/download-harfbuzz.mjs', 'scripts/native-deps.json') }}

      - name: Build dependencies and native addon
        run: |
          node scripts/download-mozjpeg.mjs
          node scripts/download-qpdf.mjs
          node scripts/download-harfbuzz.mjs
          npx node-gyp rebuild
          node scripts/bundle-lib.mjs
        env:
          VCPKG_ROOT: ${{ runner.os == 'Windows' && 'C:\vcpkg' || '' }}

      - run: npm test

  prebuild:
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: x64
            cross: true
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-2022
            platform: win32
            arch: arm64
            cross: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev nasm

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib --triplet ${{ matrix.arch }}-windows-static
        env:
          VCPKG_ROOT: C:\vcpkg

      - run: npm ci --ignore-scripts

      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/download-mozjpeg.mjs', 'scripts/download-qpdf.mjs', 'scripts/download-harfbuzz.mjs', 'scripts/native-deps.json') }}

      - name: Build mozjpeg
        run: node scripts/download-mozjpeg.mjs
        env:
          VCPKG_TARGET_TRIPLET: ${{ runner.os == 'Windows' && format('{0}-windows-static', matrix.arch) || '' }}

      - name: Build QPDF
        run: node scripts/download-qpdf.mjs
        env:
          VCPKG_ROOT: ${{ runner.os == 'Windows' && 'C:\vcpkg' || '' }}
          VCPKG_TARGET_TRIPLET: ${{ runner.os == 'Windows' && format('{0}-windows-static', matrix.arch) || '' }}

      - name: Build HarfBuzz
        run: node scripts/download-harfbuzz.mjs
        env:
          VCPKG_ROOT: ${{ runner.os == 'Windows' && 'C:\vcpkg' || '' }}
          VCPKG_TARGET_TRIPLET: ${{ runner.os == 'Windows' && format('{0}-windows-static', matrix.arch) || '' }}

      - name: Build native addon
        run: npx node-gyp rebuild --arch=${{ matrix.arch }}

      - name: Bundle shared library
        run: node scripts/bundle-lib.mjs

      - name: Run tests
        if: ${{ !matrix.cross }}
        run: npm test

      - name: Create tarball
        shell: bash
        run: |
          tar czf "qpdf-compress-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" \
            build/Release/qpdf_compress.node

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: qpdf-compress-*.tar.gz

  prebuild-linux-cross:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            docker-platform: linux/arm64
            image: node:22-bookworm
          - arch: arm
            docker-platform: linux/arm/v7
            image: node:22-bookworm
          - arch: x64
            platform-suffix: musl
            docker-platform: linux/amd64
            image: node:22-alpine
          - arch: arm64
            platform-suffix: musl
            docker-platform: linux/arm64
            image: node:22-alpine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          platforms: ${{ matrix.docker-platform }}

      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: deps-linux-${{ matrix.platform-suffix || 'glibc' }}-${{ matrix.arch }}-${{ hashFiles('scripts/download-mozjpeg.mjs', 'scripts/download-qpdf.mjs', 'scripts/download-harfbuzz.mjs', 'scripts/native-deps.json') }}

      - name: Build in Docker
        timeout-minutes: 90
        run: |
          docker run --rm --platform ${{ matrix.docker-platform }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ matrix.image }} \
            sh -c "
              if command -v apk > /dev/null; then
                apk add --no-cache cmake g++ make zlib-dev nasm python3 linux-headers
              else
                apt-get update && apt-get install -y cmake g++ zlib1g-dev nasm python3 make
              fi &&
              npm ci --ignore-scripts &&
              node scripts/download-mozjpeg.mjs &&
              node scripts/download-qpdf.mjs &&
              node scripts/download-harfbuzz.mjs &&
              npx node-gyp rebuild &&
              node scripts/bundle-lib.mjs &&
              npm test
            "

      - name: Create tarball
        run: |
          suffix="${{ matrix.platform-suffix }}"
          if [ -n "$suffix" ]; then
            tar czf "qpdf-compress-${{ github.ref_name }}-linux-${suffix}-${{ matrix.arch }}.tar.gz" \
              build/Release/qpdf_compress.node
          else
            tar czf "qpdf-compress-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz" \
              build/Release/qpdf_compress.node
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prebuild-linux-${{ matrix.platform-suffix && format('{0}-', matrix.platform-suffix) || '' }}${{ matrix.arch }}
          path: qpdf-compress-*.tar.gz

  release:
    needs: [prebuild, prebuild-linux-cross]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts

      # Publishes tokenlessly via OIDC trusted publishing. Requires a trusted
      # publisher to be configured for qpdf-compress on npmjs.com (Settings ->
      # Trusted Publisher) pointing at this repo + workflow.
      - name: Publish to npm
        run: npm publish --provenance

      - name: Download all prebuild artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: prebuild-*
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: artifacts/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/*.tar.gz --generate-notes
